services:
  - type: web
    name: smartcare
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn Hospital.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-db
          property: connectionString

  - type: web
    name: hospital-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_URL
        value: https://smartcare.onrender.com/api

databases:
  - name: hospital-db
    databaseName: hospital_db
    user: hospital_user